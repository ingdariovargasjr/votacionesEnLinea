name: Deploy Firebase Hosting

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Firebase/API environment to publish
        type: choice
        required: true
        options:
          - testing
          - production

permissions:
  contents: read

concurrency:
  group: firebase-hosting-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the matching release branch
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected_branch="producción"
          if [[ "$TARGET_ENVIRONMENT" == "testing" ]]; then expected_branch="testing"; fi
          if [[ "$SOURCE_BRANCH" != "$expected_branch" ]]; then
            echo "Environment '$TARGET_ENVIRONMENT' must be deployed from branch '$expected_branch' (got '$SOURCE_BRANCH')." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate target configuration and API health
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          for variable in VITE_API_URL VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [[ -z "${!variable}" ]]; then echo "Missing GitHub environment variable: $variable" >&2; exit 1; fi
          done
          api_url="${VITE_API_URL%/}"
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "$api_url/health"
      - name: Build frontend for selected environment
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build --workspace @gala/web
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Deploy to the selected Firebase project
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: npm exec -- firebase deploy --only "hosting:$TARGET_ENVIRONMENT" --project respeto-6e276 --non-interactive
