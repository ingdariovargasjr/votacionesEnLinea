projects:
  - name: votacionesEnLinea
    environments:
      - name: Testing
        networking:
          isolation: enabled
        services:
          - type: web
            name: gala-voting-api-testing
            runtime: node
            plan: free
            branch: testing
            autoDeployTrigger: 'off'
            buildCommand: npm ci && npm run build --workspace @gala/api
            startCommand: npm run start --workspace @gala/api
            healthCheckPath: /health
            envVars:
              - key: NODE_VERSION
                value: 22
              - key: SUPABASE_URL
                sync: false
              - key: SUPABASE_ANON_KEY
                sync: false
              - key: SUPABASE_SERVICE_ROLE_KEY
                sync: false
              - key: ADMIN_USER_IDS
                sync: false
              - key: SUPERUSER_EMAIL
                sync: false
              - key: CORS_ORIGINS
                sync: false
              - key: PUBLIC_WEB_URL
                sync: false
      - name: Production
        networking:
          isolation: enabled
        permissions:
          protection: enabled
        services:
          - type: web
            name: gala-voting-api-production
            runtime: node
            branch: 'producción'
            autoDeployTrigger: 'off'
            buildCommand: npm ci && npm run build --workspace @gala/api
            startCommand: npm run start --workspace @gala/api
            healthCheckPath: /health
            envVars:
              - key: NODE_VERSION
                value: 22
              - key: SUPABASE_URL
                sync: false
              - key: SUPABASE_ANON_KEY
                sync: false
              - key: SUPABASE_SERVICE_ROLE_KEY
                sync: false
              - key: ADMIN_USER_IDS
                sync: false
              - key: SUPERUSER_EMAIL
                sync: false
              - key: CORS_ORIGINS
                sync: false
              - key: PUBLIC_WEB_URL
                sync: false
